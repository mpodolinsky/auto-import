[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-import"
version = "0.1.0"
description = "IPython/Jupyter extension that installs missing packages on ModuleNotFoundError and re-runs the cell"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["ipython"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
